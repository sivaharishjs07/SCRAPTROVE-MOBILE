name: Build staging APK

# Kicks off an EAS cloud build (Expo's servers do the work — no local
# Java or Android SDK needed). The `preview` profile in eas.json bakes
# EXPO_PUBLIC_API_URL=https://api.stage.scraptrove.com so the resulting
# APK talks to the staging worker.
#
# Trigger this manually from the Actions tab, or on every push to
# `main` / `durai` if you want each merge to auto-produce a new APK.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS profile (preview = staging, production = live)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
      - durai
    paths:
      - 'src/**'
      - 'assets/**'
      - 'plugins/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'google-services.json'
      - 'index.js'
      - 'App.js'
      - '.github/workflows/build-staging-apk.yml'

jobs:
  build:
    name: EAS cloud build (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    # 45 min gives generous headroom over the ~15-20 min typical Expo
    # queue + build time on the free tier.
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK on Expo cloud (waits for finish)
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # `--json` prints one JSON blob per finished build to stdout when
        # --wait is set. We tee it to a file so the next step can parse
        # out the .apk download URL. --no-wait would exit immediately and
        # leave us with nothing to upload here.
        run: |
          # Without pipefail the pipeline below takes tee's exit code, so a
          # build that failed instantly (quota, auth, config) still showed
          # as a green step and the failure surfaced one step later as an
          # unrelated JSON parse error on an empty file. EAS writes its
          # error text to stderr, which stays visible in this log.
          set -o pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it at Repo > Settings > Secrets and variables > Actions."
            exit 1
          fi
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --non-interactive \
            --wait \
            --json | tee eas-build.json

      - name: Extract APK URL from EAS output
        id: apk
        run: |
          # `eas build --json --wait` emits an array of build objects. Pull
          # the artifacts.buildUrl (that's the signed .apk download link).
          URL=$(node -e "const b=JSON.parse(require('fs').readFileSync('eas-build.json','utf8')); const arr=Array.isArray(b)?b:[b]; console.log(arr[0]?.artifacts?.buildUrl||'')")
          if [ -z "$URL" ]; then
            echo "::error::EAS build finished but no artifact URL was returned."
            cat eas-build.json || true
            exit 1
          fi
          echo "APK URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: |
          mkdir -p out
          # EAS artifact URLs are pre-signed and time-limited (~30 min);
          # we're downloading well within that window.
          curl -fL --retry 3 -o out/scraptrove-staging.apk "${{ steps.apk.outputs.url }}"
          ls -lh out/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraptrove-staging-apk
          path: out/scraptrove-staging.apk
          # 30 days keeps the .apk downloadable from the Actions run page
          # without indefinite storage bloat.
          retention-days: 30

      - name: Show download hint
        run: |
          echo "::notice title=APK ready::Download from the 'Artifacts' section at the bottom of this workflow run summary page."
